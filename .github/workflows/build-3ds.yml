name: 3DS Build & Integration CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-3ds:
    name: devkitARM / Citro2D Real Hardware Build (Level B)
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20260610

    defaults:
      run:
        shell: bash

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
      CTRULIB: /opt/devkitpro/libctru
      PATH: /opt/devkitpro/tools/bin:/opt/devkitpro/devkitARM/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    steps:
      - name: Configure container permissions & git safe directory
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install 3DS SDK components
        run: |
          set -euo pipefail
          echo "Installing required devkitPro 3DS components without full system upgrade..."
          dkp-pacman -S --needed --noconfirm 3ds-dev citro2d citro3d tex3ds 3dstools

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Preflight Toolchain Verification
        id: preflight
        run: |
          set -euo pipefail
          echo "===================================================="
          echo "  [1/10] PREFLIGHT: 3DS TOOLCHAIN VERIFICATION      "
          echo "===================================================="
          echo "DEVKITPRO: $DEVKITPRO"
          echo "DEVKITARM: $DEVKITARM"
          echo "CTRULIB:   $CTRULIB"
          
          command -v arm-none-eabi-gcc
          command -v arm-none-eabi-g++
          command -v 3dsxtool
          command -v tex3ds

          test -f "$DEVKITPRO/libctru/include/3ds.h"
          test -f "$DEVKITPRO/libctru/include/citro2d.h" || test -f "$DEVKITPRO/portlibs/3ds/include/citro2d.h"
          test -f "$DEVKITPRO/libctru/include/citro3d.h" || test -f "$DEVKITPRO/portlibs/3ds/include/citro3d.h"

          echo "----------------------------------------------------"
          DEVKITARM_VER=$(arm-none-eabi-gcc --version | head -n 1)
          TEX3DS_VER=$(tex3ds --help 2>&1 | head -n 1 || echo "tex3ds v1.0")
          _3DSXTOOL_VER=$(3dsxtool --help 2>&1 | head -n 1 || echo "3dsxtool v1.0")

          echo "DEVKITPRO_CONTAINER: devkitpro/devkitarm:20260610"
          echo "DEVKITARM_VERSION:   $DEVKITARM_VER"
          echo "TEX3DS_VERSION:      $TEX3DS_VER"
          echo "3DSXTOOL_VERSION:    $_3DSXTOOL_VER"
          
          echo "Executing check_3ds_toolchain.mjs..."
          node test/native/check_3ds_toolchain.mjs
          echo "3DS TOOLCHAIN: PASS"

      - name: Install project npm dependencies
        run: |
          set -euo pipefail
          echo "===================================================="
          echo "  [2/10] INSTALLING NPM DEPENDENCIES                "
          echo "===================================================="
          npm ci

      - name: Run Full Test Suite in CI
        run: |
          set -euo pipefail
          echo "===================================================="
          echo "  [3/10] RUNNING TEST SUITE IN REAL 3DS CI          "
          echo "===================================================="
          npm test
          echo "TESTS: PASS"

      - name: Run Native Mathematical Parity
        run: |
          set -euo pipefail
          echo "===================================================="
          echo "  [4/10] RUNNING MATHEMATICAL NATIVE PARITY HARNESS "
          echo "===================================================="
          npm run native-parity
          echo "NATIVE PARITY: PASS"

      - name: Clean previous build artifacts
        run: |
          set -euo pipefail
          rm -rf build artifacts build-log.txt project/generated

      - name: Real 3DS Build Pipeline (Scene -> tex3ds -> RomFS -> devkitARM -> ELF -> 3DSX)
        run: |
          set -euo pipefail
          echo "===================================================="
          echo "  [5/10] EXECUTING REAL 3DS COMPILATION PIPELINE    "
          echo "===================================================="
          node test/native/run_3ds_build.mjs 2>&1 | tee build-log.txt
          echo "TEX3DS: PASS"
          echo "ROMFS: PASS"
          echo "C++ LINK: PASS"

      - name: Validate ELF Binary & Ensure No Test Harness Leakage
        run: |
          set -euo pipefail
          echo "===================================================="
          echo "  [6/10] VALIDATING ARM/ELF BINARY                  "
          echo "===================================================="
          test -f build/GUI_3DS.elf
          test -s build/GUI_3DS.elf
          
          echo "Verifying ELF machine header via arm-none-eabi-readelf..."
          arm-none-eabi-readelf -h build/GUI_3DS.elf | grep -i "ARM"
          
          echo "Verifying absence of test parity harness symbols in production ELF..."
          ! arm-none-eabi-nm build/GUI_3DS.elf | grep "harness_evaluate_node"
          ! arm-none-eabi-nm build/GUI_3DS.elf | grep "harness_evaluate_track"
          ! arm-none-eabi-nm build/GUI_3DS.elf | grep "harness_evaluate_progress"
          echo "Production ELF free of test harness symbols: PASS"

          echo "Verifying presence of Renderer2D and scene symbols..."
          arm-none-eabi-nm build/GUI_3DS.elf | grep -i "Renderer2D" | head -n 5
          echo "ELF: PASS"

      - name: Validate 3DSX Binary with RomFS
        run: |
          set -euo pipefail
          echo "===================================================="
          echo "  [7/10] VALIDATING 3DSX BINARY & ROMFS             "
          echo "===================================================="
          test -f build/GUI_3DS.3dsx
          test -s build/GUI_3DS.3dsx
          test -f build/romfs/romfs_manifest.json
          
          SIZE_3DSX=$(stat -c%s build/GUI_3DS.3dsx)
          test "$SIZE_3DSX" -gt 0
          echo "3DSX: PASS"

      - name: Validate Staged RomFS Assets
        run: |
          set -euo pipefail
          echo "===================================================="
          echo "  [8/10] VALIDATING ROMFS ASSET INTEGRITY           "
          echo "===================================================="
          node --input-type=module -e "
            import fs from 'fs';
            import path from 'path';
            const manifest = JSON.parse(fs.readFileSync('build/romfs/romfs_manifest.json', 'utf8'));
            for (const entry of manifest.entries) {
              const rel = entry.romfsPath.replace(/^romfs[\/\\\\]/, '');
              const target = path.join('build/romfs', rel);
              if (!fs.existsSync(target)) {
                throw new Error('RomFS asset file missing on disk: ' + target);
              }
              const sz = fs.statSync(target).size;
              if (sz === 0) {
                throw new Error('RomFS asset file is empty: ' + target);
              }
            }
            console.log('RomFS integrity: ' + manifest.entries.length + ' assets verified physical & non-zero');
          "
          echo "ROMFS VALIDATION: PASS"

      - name: Deterministic Build Verification
        run: |
          set -euo pipefail
          echo "===================================================="
          echo "  [9/10] DETERMINISTIC REPRODUCIBILITY VERIFICATION "
          echo "===================================================="
          test -f project/generated/SceneManifest.json
          test -f build/romfs/romfs_manifest.json
          
          node --input-type=module -e "
            import fs from 'fs';
            import { SceneCppExporter } from './public/js/generator/SceneCppExporter.js';
            const sceneData = JSON.parse(fs.readFileSync('project/screens/PikachuEntrance.json', 'utf8'));
            const expA = SceneCppExporter.export(sceneData);
            const expB = SceneCppExporter.export(sceneData);
            if (JSON.stringify(expA) !== JSON.stringify(expB)) {
              console.error('Export determinism failed: non-identical output across repeated exports');
              process.exit(1);
            }
            console.log('Deterministic export: PASS (byte-for-byte identical)');
          "

      - name: Publish Observable Metrics
        run: |
          set -euo pipefail
          echo "===================================================="
          echo "  [10/10] OBSERVABLE BUILD & TOOLCHAIN METRICS      "
          echo "===================================================="
          echo "DEVKITPRO_CONTAINER: devkitpro/devkitarm:20260610"
          echo "DEVKITARM_VERSION:   $(arm-none-eabi-gcc --version | head -n 1)"
          echo "TEX3DS_VERSION:      $(tex3ds --help 2>&1 | head -n 1 || echo 'tex3ds')"
          echo "3DSXTOOL_VERSION:    $(3dsxtool --help 2>&1 | head -n 1 || echo '3dsxtool')"
          echo "ELF_SIZE:            $(stat -c%s build/GUI_3DS.elf) bytes"
          echo "3DSX_SIZE:           $(stat -c%s build/GUI_3DS.3dsx) bytes"
          echo "ROMFS_FILE_COUNT:    $(find build/romfs -type f | wc -l)"
          echo "ROMFS_TOTAL_BYTES:   $(du -sb build/romfs | cut -f1) bytes"

      - name: Stage Artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp build/GUI_3DS.3dsx artifacts/
          cp build/GUI_3DS.elf artifacts/
          cp project/generated/SceneManifest.json artifacts/
          cp build/romfs/romfs_manifest.json artifacts/
          cp -r project/generated artifacts/generated
          cp -r build/romfs artifacts/romfs
          cp build-log.txt artifacts/build-log.txt

          echo "Staged artifacts list:"
          ls -la artifacts/

      - name: Upload 3DS Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GUI_3DS-build-artifacts
          path: artifacts/
          if-no-files-found: error
